<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HabitApp</title>
    <style>
      html, body, #root {
        height: 100%;
        margin: 0;
      }
      #root {
        display: flex;
        flex-direction: column;
      }
      /* Remove the browser focus outline on text inputs */
      input:focus,
      textarea:focus {
        outline: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
